# Applies new migrations to the production Supabase project when main changes.
#
# Connects straight to the database through Supabase's connection pooler
# (GitHub runners have no IPv6, so the direct db.<ref> host is unreachable).
# Needs only the repository secret SUPABASE_DB_PASSWORD_PROD; no account-level
# access token is involved.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PROJECT_REF: vwzyalzkckfuwwtyxdyl
      POOLER_HOST: aws-0-ap-south-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build database URL
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          encoded=$(node -e 'process.stdout.write(encodeURIComponent(process.env.DB_PASSWORD))')
          echo "::add-mask::$encoded"
          echo "DB_URL=postgresql://postgres.${PROJECT_REF}:${encoded}@${POOLER_HOST}:5432/postgres" >> "$GITHUB_ENV"

      - name: Show pending migrations
        run: npx supabase migration list --db-url "$DB_URL"

      - name: Apply migrations
        run: npx supabase db push --db-url "$DB_URL"
