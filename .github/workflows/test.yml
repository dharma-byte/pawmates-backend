# Runs every migration and all pgTAP tests (RLS, functions, storage policies)
# against a fresh local Supabase stack.
name: Test

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Skip services the tests don't use to save a few minutes. Auth, storage
      # and realtime stay: the migrations add policies to their schemas.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Run database tests
        run: npx supabase test db

      - name: Lint database functions
        run: npx supabase db lint --schema public,private --level error
