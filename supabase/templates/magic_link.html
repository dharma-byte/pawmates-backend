<!-- Magic link sign-in. Uses a token_hash link so it works in any browser or device. -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #171717;">
  <h2 style="margin: 0 0 16px;">🐾 Sign in to Pawmates</h2>
  <p>Tap the button below to sign in. No password needed.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/home"
       style="background: #171717; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block;">
      Sign in
    </a>
  </p>
  <p style="color: #737373; font-size: 14px;">This link works once and expires in 1 hour. If you didn't ask to sign in, you can ignore this email.</p>
</div>
