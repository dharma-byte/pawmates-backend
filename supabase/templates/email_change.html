<!-- Email address change. Uses a token_hash link so it works in any browser or device. -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #171717;">
  <h2 style="margin: 0 0 16px;">🐾 Confirm your new email</h2>
  <p>Confirm that you want to change your Pawmates email from {{ .Email }} to {{ .NewEmail }}.</p>
  <p style="margin: 24px 0;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/settings"
       style="background: #171717; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; display: inline-block;">
      Confirm new email
    </a>
  </p>
  <p style="color: #737373; font-size: 14px;">If you didn't ask for this change, ignore this email and your address stays the same.</p>
</div>
